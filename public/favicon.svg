  <text x="10" y="18" fill="#a3a3a3" font-family="monospace" font-size="9" text-anchor="middle">+</text>
  <text x="54" y="18" fill="#a3a3a3" font-family="monospace" font-size="9" text-anchor="middle">+</text>
  <text x="10" y="55" fill="#a3a3a3" font-family="monospace" font-size="9" text-anchor="middle">+</text>
  <text x="54" y="55" fill="#a3a3a3" font-family="monospace" font-size="9" text-anchor="middle">+</text>
  <!-- prompt glyph -->
